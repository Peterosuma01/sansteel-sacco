    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
            width: 100%;
        }

        .logo-container {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .logo-container svg {
            width: 120px;
            height: 120px;
        }

        h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .tagline {
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            margin-bottom: 40px;
        }

        .launch-btn {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.4);
        }

        .launch-btn:active {
            transform: translateY(0);
        }

        .features {
            margin-top: 50px;
            display: grid;
            gap: 20px;
        }

        .feature {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .feature-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }

        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 10000;
            max-width: 90%;
        }

        .install-prompt.show {
            display: flex;
        }

        .install-btn {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .install-btn:active {
            background: #1e3175;
        }

        .close-btn {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }
            
            .logo-container {
                width: 120px;
                height: 120px;
            }
            
            .logo-container svg {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="90" fill="#1e3189"/>
                <circle cx="100" cy="100" r="75" fill="white" stroke="#1e3989" stroke-width="2"/>
                <path d="M 60 90 Q 80 70 100 90 Q 120 70 140 90" fill="none" stroke="#1e3989" stroke-width="3"/>
                <ellipse cx="70" cy="75" rx="8" ry="10" fill="#1e3989"/>
                <ellipse cx="130" cy="75" rx="8" ry="10" fill="#1e3989"/>
                <path d="M 60 110 Q 100 130 140 110" fill="none" stroke="#1e3989" stroke-width="3"/>
                <text x="100" y="170" font-family="Arial" font-size="20" text-anchor="middle" fill="white" font-weight="bold">S.S. LTD</text>
            </svg>
        </div>
        
        <h1>Stansteel Sacco</h1>
        <p class="tagline">Your trusted financial partner</p>
        
        <button class="launch-btn" id="launchBtn">Launch App</button>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">💰</div>
                <div class="feature-title">Secure Banking</div>
                <div class="feature-desc">Manage your finances securely</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <div class="feature-title">Mobile Access</div>
                <div class="feature-desc">Access anywhere, anytime</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🤝</div>
                <div class="feature-title">Trusted Service</div>
                <div class="feature-desc">Serving our community with excellence</div>
            </div>
        </div>
    </div>

    <div class="install-prompt" id="installPrompt">
        <span>📲 Install Stansteel Sacco for easy access!</span>
        <button class="install-btn" id="installBtn">Install</button>
        <button class="close-btn" id="closeBtn">Later</button>
    </div>

    <script>
        const APP_URL = 'https://script.google.com/macros/s/AKfycbwOCufPjkayPfyEvFkZED6VWCyst1r0jiL7zBR-XUd1BoscwMT1I2WJnBknKL3D4sYY/exec';

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'stansteel-sacco-v1';
                const urlsToCache = ['/'];

                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME)
                            .then(cache => cache.addAll(urlsToCache))
                    );
                });

                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request)
                            .then(response => response || fetch(event.request))
                    );
                });
            `;
            
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed:', err));
        }

        // Launch button
        document.getElementById('launchBtn').addEventListener('click', () => {
            window.location.href = APP_URL;
        });

        // Install prompt handling
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const installBtn = document.getElementById('installBtn');
        const closeBtn = document.getElementById('closeBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            setTimeout(() => {
                installPrompt.classList.add('show');
            }, 2000);
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installPrompt.classList.remove('show');
            }
        });

        closeBtn.addEventListener('click', () => {
            installPrompt.classList.remove('show');
        });

        // Handle app installed
        window.addEventListener('appinstalled', () => {
            console.log('Stansteel Sacco installed successfully');
            installPrompt.classList.remove('show');
        });

        // Auto-redirect if app is installed (standalone mode)
        if (window.matchMedia('(display-mode: standalone)').matches) {
            window.location.href = APP_URL;
        }
    </script>
</body>
