<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="description" content="Sansteel Sacco Limited - Your trusted financial partner">
    <title>Sansteel Sacco</title>
    <link rel="manifest" id="manifest-placeholder">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIiB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCI+PGNpcmNsZSBjeD0iMTAwIiBjeT0iMTAwIiByPSI5MCIgZmlsbD0iIzFlMzE4OSIvPjxjaXJjbGUgY3g9IjEwMCIgY3k9IjEwMCIgcj0iNzAiIGZpbGw9IndoaXRlIiBzdHJva2U9IiMxZTM5ODkiIHN0cm9rZS13aWR0aD0iMiIvPjx0ZXh0IHg9IjEwMCIgeT0iMTcwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMjQiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IndoaXRlIj5TUy4gTFREPC90ZXh0Pjwvc3ZnPg==">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 500px;
            width: 100%;
        }

        .logo-container {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 10px;
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .tagline {
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            margin-bottom: 40px;
        }

        .launch-btn {
            background: white;
            color: #1e3a8a;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.4);
        }

        .launch-btn:active {
            transform: translateY(0);
        }

        .features {
            margin-top: 50px;
            display: grid;
            gap: 20px;
        }

        .feature {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .feature-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }

        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 10000;
            max-width: 90%;
        }

        .install-prompt.show {
            display: flex;
        }

        .install-btn {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .install-btn:active {
            background: #1e3175;
        }

        .close-btn {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 28px;
            }
            
            .logo-container {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" alt="Sansteel Sacco Logo" style="width: 120px; height: 120px; border-radius: 50%;" />
        </div>
        
        <h1>Sansteel Sacco</h1>
        <p class="tagline">Your trusted financial partner</p>
        
        <button class="launch-btn" id="launchBtn">Launch App</button>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">💰</div>
                <div class="feature-title">Secure Banking</div>
                <div class="feature-desc">Manage your finances securely</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <div class="feature-title">Mobile Access</div>
                <div class="feature-desc">Access anywhere, anytime</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🤝</div>
                <div class="feature-title">Trusted Service</div>
                <div class="feature-desc">Serving our community with excellence</div>
            </div>
        </div>
    </div>

    <div class="install-prompt" id="installPrompt">
        <span>📲 Install Sansteel Sacco for easy access!</span>
        <button class="install-btn" id="installBtn">Install</button>
        <button class="close-btn" id="closeBtn">Later</button>
    </div>

    <script>
        const APP_URL = 'https://script.google.com/macros/s/AKfycbwOCufPjkayPfyEvFkZED6VWCyst1r0jiL7zBR-XUd1BoscwMT1I2WJnBknKL3D4sYY/exec';

        // Create and inject manifest dynamically
        const manifestData = {
            "name": "Sansteel Sacco",
            "short_name": "Sansteel",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#1e3a8a",
            "theme_color": "#1e3a8a",
            "orientation": "portrait-primary",
            "icons": [
                {
                    "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
                    "sizes": "192x192",
                    "type": "image/png",
                    "purpose": "any maskable"
                },
                {
                    "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }
            ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        document.getElementById('manifest-placeholder').setAttribute('href', manifestURL);

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'sansteel-sacco-v1';
                const urlsToCache = ['./', 'index.html'];

                self.addEventListener('install', event => {
                    self.skipWaiting();
                    event.waitUntil(
                        caches.open(CACHE_NAME)
                            .then(cache => cache.addAll(urlsToCache).catch(err => console.log(err)))
                    );
                });

                self.addEventListener('activate', event => {
                    event.waitUntil(self.clients.claim());
                });

                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request)
                            .then(response => response || fetch(event.request))
                            .catch(() => caches.match('./'))
                    );
                });
            `;
            
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed:', err));
        }

        // Launch button
        document.getElementById('launchBtn').addEventListener('click', () => {
            window.location.href = APP_URL;
        });

        // Install prompt handling
        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const installBtn = document.getElementById('installBtn');
        const closeBtn = document.getElementById('closeBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            setTimeout(() => {
                installPrompt.classList.add('show');
            }, 2000);
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installPrompt.classList.remove('show');
            }
        });

        closeBtn.addEventListener('click', () => {
            installPrompt.classList.remove('show');
        });

        // Handle app installed
        window.addEventListener('appinstalled', () => {
            console.log('Sansteel Sacco installed successfully');
            installPrompt.classList.remove('show');
        });

        // Auto-redirect if app is installed (standalone mode)
        if (window.matchMedia('(display-mode: standalone)').matches) {
            window.location.href = APP_URL;
        }
    </script>
</body>
</html>
